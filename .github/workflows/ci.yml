name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Compute coverage badge data
        if: github.event_name == 'push'
        run: |
          pct=$(awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "%.0f", (c/(m+c))*100}' target/site/jacoco/jacoco.csv)
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 80 ]; then color=green
          elif [ "$pct" -ge 70 ]; then color=yellowgreen
          elif [ "$pct" -ge 60 ]; then color=yellow
          elif [ "$pct" -ge 50 ]; then color=orange
          else color=red; fi
          mkdir -p badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" \
            > badge/coverage.json
          echo "Coverage: ${pct}% (${color})"

      # main is protected by a ruleset (PR + required "build" check), so the badge can't be
      # committed there. Publish it as the only commit on a separate "badges" branch instead;
      # the README badge reads it from there. Force-pushing a fresh root commit keeps that
      # branch at one commit instead of growing a history of badge updates.
      - name: Publish coverage badge
        if: github.event_name == 'push'
        working-directory: badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b badges
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
